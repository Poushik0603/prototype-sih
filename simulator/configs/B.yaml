# Config B — "slow long-chain" mule pattern. Circularity-protocol TEST config #1.
# Rationale: diverges from A primarily along TOPOLOGY + TIMING (deeper chains, much more
# randomized/spread-out delays, structured partial withdrawals instead of one big pull). This
# simulates the more "sophisticated"/evasive mule rings that deliberately slow-walk and split
# cash-outs to stay under reporting thresholds and dodge velocity-based fraud rules. If a model
# trained on A can still detect B's terminals, it has learned the underlying "money converges at
# a terminal near complaint time" signal rather than memorizing A's specific hop/delay fingerprint.
seed: 43

calibration:
  calibration_manifest: ../data/calibration/manifest.json
  region: "placeholder-india-city"

mule_network:
  # Longer chains: layering through 3-6 hops to obscure the trail.
  hop_count_distribution: { type: poisson, lambda: 4 }
  # Much slower & more variable: mean delay pushed out and spread wider (mu=2.6 -> median ~13h,
  # sigma=1.3 -> heavy tail reaching multiple days between hops).
  delay_between_hops_hours: { type: lognormal, mu: 2.6, sigma: 1.3 }
  # Structuring: cash out in several sub-threshold withdrawals over time instead of one pull.
  cash_out_pattern: "structured_below_threshold"
  # Deliberately avoid terminals with recent heavy traffic/hotspot history (evasive choice),
  # in contrast to A's naive nearest-terminal heuristic.
  terminal_choice: "hotspot_avoidant"
  fan_out_accounts_per_complaint: { type: uniform, low: 3, high: 7 }

benign_background:
  daily_txn_volume_per_terminal: { type: poisson, lambda: 8 }  # see A.yaml comment
  amount_distribution: { type: lognormal, mu: 6.0, sigma: 1.0 }

label_noise:
  # Slower rings -> more victims notice late or never -> higher false-negative rate.
  false_negative_rate: 0.08
  false_positive_rate: 0.02
  # Delayed reporting is part of B's story: wider label delay window.
  label_delay_days: { type: uniform, low: 0, high: 21 }

# Comparable but offset time range: overlaps A's month but shifted later + slightly longer,
# so B is not just "the same calendar days with different accounts."
time_range:
  start: "2026-01-12"
  end: "2026-02-02"

scale:
  num_benign_accounts: 900
  num_complaints: 110
  rules_version: "sim-rules-v1.0-B"
