# Config A — "fast short-chain" mule pattern. CANONICAL / TRAINING config.
# Rationale: A is the config the Model agent trains on (circularity protocol, PROJECT_SPEC.md
# "Circularity protocol" step 1). It represents the most common real-world pattern reported in
# NCRP-style complaint writeups: a victim's money is moved through a short chain of 1-3 mule
# hops and cashed out quickly (same day) before the bank can freeze it. Kept "canonical" so B/C
# can each diverge from it along a different axis (topology OR timing OR terminal heuristic).
seed: 42

calibration:
  calibration_manifest: ../data/calibration/manifest.json
  region: "placeholder-india-city"   # overwritten in log if real calibration manifest found

mule_network:
  # Short chains: most mule rings in NCRP writeups launder via 1-3 hops before cash-out.
  hop_count_distribution: { type: poisson, lambda: 2 }
  # Fast turnover: hops happen within hours of each other (mean ~4.5h from lognormal(1.5,0.8)).
  delay_between_hops_hours: { type: lognormal, mu: 1.5, sigma: 0.8 }
  # Whole balance pulled in one shot at the final hop — speed over stealth.
  cash_out_pattern: "single_large_withdrawal"
  # Mules cash out near wherever the money currently sits (last hop's "home" terminal) —
  # minimizes their own travel/exposure time.
  terminal_choice: "nearest_to_last_hop"
  fan_out_accounts_per_complaint: { type: uniform, low: 2, high: 5 }

benign_background:
  # lambda kept modest (vs. template's 40) because the real terminals table has ~1150
  # terminals; at 40/terminal/day that's ~1M+ benign rows for a 3-week window, more than a
  # hackathon demo needs. 8/terminal/day keeps total volume in the low-hundreds-of-thousands.
  daily_txn_volume_per_terminal: { type: poisson, lambda: 8 }
  amount_distribution: { type: lognormal, mu: 6.0, sigma: 1.0 }

label_noise:
  # ~5% of true mule withdrawals never get linked to a complaint in time (victim never reports,
  # or reports to wrong channel) -> false negative in our label.
  false_negative_rate: 0.05
  # ~2% of complaints misattribute an innocent account as a mule (victim/bank error).
  false_positive_rate: 0.02
  label_delay_days: { type: uniform, low: 0, high: 14 }

# Thin-slice demo scale: 3-week window (kept short vs. template's 2 months to bound runtime/
# data volume while still giving several distinct "incident days" for the model to learn from).
time_range:
  start: "2026-01-05"
  end: "2026-01-26"

# --- simulator-internal scale knobs (not in original template; needed to hit the spec's
# "few hundred to low-thousands of label=1 terminal-windows" target at hackathon scale) ---
scale:
  num_benign_accounts: 900
  num_complaints: 140          # -> mule rings; each ring = 1 complaint + fan_out mule accounts
  rules_version: "sim-rules-v1.0-A"
