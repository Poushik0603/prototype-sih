version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cassandra_pg
    environment:
      POSTGRES_USER: cassandra
      POSTGRES_PASSWORD: cassandra
      POSTGRES_DB: cassandra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassandra -d cassandra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
